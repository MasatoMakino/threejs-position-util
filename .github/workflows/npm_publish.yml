name: Publish to npm
# A maintainer compares the shasum in the publish job log with the staged
# packages page of the npm account, then approves the staged version there
# or with `npm stage approve <stage-id>`, with 2FA.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag points to the checked-out commit
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG points to $TAG_SHA, not $GITHUB_SHA"
            exit 1
          fi

      - name: Verify the commit is on the default branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Verify the tag matches the package.json version
        run: |
          VERSION=$(jq -r .version package.json)
          # npm publish without --tag marks a prerelease as latest.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not in X.Y.Z format"
            exit 1
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          # A workflow that mints an OIDC token restores no cache.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run buildTS

      - name: Pack
        run: pnpm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  # Only this job can mint an OIDC token, and it runs no dependency code.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # Node 26 bundles npm 11.20+, which meets the npm 11.15.0+ requirement of staged publishing.
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Stage package on npm
        run: npm stage publish ./*.tgz --provenance --access public
