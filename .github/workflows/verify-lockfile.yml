name: Verify actions lockfile
# Fails when .github/workflows/actions.lock is out of sync with the workflows
# or a locked commit no longer verifies upstream. npm_publish.yml runs only on
# release, so this job catches its stale entries before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
